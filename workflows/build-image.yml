name: Build and Publish POC Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-publish:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Convert Repository Name to Lowercase
        id: repo
        shell: bash
        run: |
          echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:1.0
            ghcr.io/${{ steps.repo.outputs.name }}:latest

      - name: POC Summary
        shell: bash
        run: |
          echo "Docker image successfully published"
          echo "Image:"
          echo "ghcr.io/${{ steps.repo.outputs.name }}:1.0"
          echo ""
          echo "Latest:"
          echo "ghcr.io/${{ steps.repo.outputs.name }}:latest"
